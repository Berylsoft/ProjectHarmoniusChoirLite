{% extends "base.html" %}

{% block title -%}
  提交试音
{%- endblock %}

{% block head -%}
  {% include "buttonInclude.html" %}
  {% include "selectorInclude.html" %}
  <link href="/static/pages/user/submit.css?h={{ env!("AH_PAGES_USER_SUBMIT_CSS") }}" rel="stylesheet" />
{%- endblock %}

{% block content %}
  <form id="formSubmit" action="" method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="file">文件</label>
      <input type="file" id="file" name="file" required>
    </div>
    <div class="field">
      <label for="signature">署名</label>
      <input type="text"
        id="signature"
        name="signature"
        required
        minlength="1"
        maxlength="20"
        value="{{ prev_signature }}"
        placeholder="输入"
        >
    </div>
    <div>
      <label for="hgi">和声组意向</label>
      <input type="hidden" id="hgi" name="hgi" value="0">
      <comp-selector id="selHgi">
        <button data-selected type="button">无</button>
        <button type="button">有</button>
      </comp-selector>
    </div>
    <div>
      <button class="button theme">提交</button>
    </div>
    <script type="module">
      const es = formSubmit.elements;
      const r = /^(?:[^\x00-\x1F\x7F-\u009F\uE000-\uF8FF\u{F0000}-\u{FFFFD}\u{100000}-\u{10FFFD}]*)$/u;
      es.signature.oninput = (e) => {
        const i = e.target;
        if (!r.test(i.value)) {
          i.setCustomValidity("character isn't supported");
        } else {
          i.setCustomValidity("");
        }
      };

      es.file.oninput = (e) => {
        const i = e.target;
        const f = i.files[0];
        if (f && (f.size < {{ size_min }} || f.size > {{ size_max }})) {
          i.setCustomValidity(
            "不支持的文件大小, 请选择大小在 {{ size_min | filesizeformat }} \
和 {{ size_max | filesizeformat }} 之间的文件"
          );
        } else {
          i.setCustomValidity("");
        }
      };

      let prevHgi = false;
      selHgi.onchange = () => {
        prevHgi = !prevHgi;
        let s = prevHgi ? [false, true] : [true, false];
        es.hgi.value = s[0] ? "0" : "1"
        return s
      };
    </script>
  </form>
{% endblock %}
