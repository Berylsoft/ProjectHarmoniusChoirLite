{% extends "base.html" %}

{% block title -%}
  {{ items.len() }} 个已提交的试音
{%- endblock %}

{% block content %}
  <div>
    <a href="/user/submit">提交试音</a>
    {% if is_manager -%}
      <span> </span>
      <a href="/manager/submits">审核试音</a>
    {%- endif %}
  </div>
  {% for item in items %}
    {{ format!("{item:?}") }}
    <br/>
  {% endfor %}
{% endblock %}
